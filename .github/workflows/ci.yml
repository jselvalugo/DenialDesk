name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: no job may write to the repo or PRs (R-7.4.2). Every `uses:` is pinned to a
# full commit SHA with a `# vX.Y.Z` comment; Dependabot (.github/dependabot.yml) bumps both.
# Service images are pinned by digest; Dependabot does not update them, so refresh them together
# with docker-compose.yml (which it does update).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  checks:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from package.json's packageManager; corepack refuses it unless its sha512 matches
      # (SC-A4.2). pnpm/action-setup would drop the hash and self-update from the registry. Node.js 25+
      # no longer bundles corepack, so a NODE_VERSION bump past 24 must install it first.
      - run: corepack enable && corepack install
      # Again, now that pnpm exists, to restore the pnpm store cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16 (16.15, built 2026-09-19) pinned by digest (SC-A4.2); keep in step with docker-compose.yml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: denialdesk
          POSTGRES_PASSWORD: denialdesk-ci-only
          POSTGRES_DB: denialdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U denialdesk" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://denialdesk:denialdesk-ci-only@localhost:5432/denialdesk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from package.json's packageManager; corepack refuses it unless its sha512 matches
      # (SC-A4.2). pnpm/action-setup would drop the hash and self-update from the registry. Node.js 25+
      # no longer bundles corepack, so a NODE_VERSION bump past 24 must install it first.
      - run: corepack enable && corepack install
      # Again, now that pnpm exists, to restore the pnpm store cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm test:integration

  e2e:
    name: End-to-end smoke (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16 (16.15, built 2026-09-19) pinned by digest (SC-A4.2); keep in step with docker-compose.yml.
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: denialdesk
          POSTGRES_PASSWORD: denialdesk-ci-only
          POSTGRES_DB: denialdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U denialdesk" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://denialdesk:denialdesk-ci-only@localhost:5432/denialdesk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm comes from package.json's packageManager; corepack refuses it unless its sha512 matches
      # (SC-A4.2). pnpm/action-setup would drop the hash and self-update from the registry. Node.js 25+
      # no longer bundles corepack, so a NODE_VERSION bump past 24 must install it first.
      - run: corepack enable && corepack install
      # Again, now that pnpm exists, to restore the pnpm store cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Generate a throwaway field-encryption key for this run
        run: echo "FIELD_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  security:
    name: Dependency audit and secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No dependency cache: this job reads the lockfile only (no install), so there's nothing to
      # save, and setup-node's post step fails when the cache path doesn't exist.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # pnpm from packageManager, sha512-checked by corepack (SC-A4.2).
      - run: corepack enable && corepack install
      - run: pnpm audit --audit-level=high
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments need pull-requests: write; findings still fail the job and appear in the log.
          GITLEAKS_ENABLE_COMMENTS: false

  container:
    name: Container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t denialdesk:ci .
      # SC-B12.3: no package managers or source maps in the runtime image, and not root.
      - name: Runtime image has no build tools or source maps
        run: |
          docker run --rm --entrypoint sh denialdesk:ci -c '
            for tool in npm npx corepack yarn yarnpkg pnpm apk; do
              if command -v "$tool"; then echo "found $tool"; exit 1; fi
            done
            if find /app -name "*.map" | grep .; then exit 1; fi
            test "$(id -u)" != 0
          '
