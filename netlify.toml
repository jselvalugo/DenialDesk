# Pre-production only, synthetic data only (ADR 0003). Runbook: docs/runbooks/netlify.md
[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

# Only the main site deploy runs migrations. Deploy previews for PR branches build against the
# existing schema, so an unreviewed branch can't alter the shared database (security review 12).
[context.production]
  command = "pnpm db:migrate && pnpm build"
