# Local development database only. Synthetic data only; never point this at real data.
services:
  db:
    # postgres:16 (16.15) pinned by digest, the same image CI uses (SC-A4.2).
    image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
    environment:
      POSTGRES_USER: denialdesk
      POSTGRES_PASSWORD: denialdesk-local-only
      POSTGRES_DB: denialdesk
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
volumes:
  db-data:
